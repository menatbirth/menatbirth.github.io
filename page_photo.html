<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photos / Peakpark</title>
    <link href="style.css?v=5" rel="stylesheet" />
    <script src="theme.js?v=5"></script>
  </head>
  <body class="content-page photo-page">
    <div class="theme-keys theme-keys--floating" role="group" aria-label="Display theme">
      <button class="theme-key" type="button" data-theme-choice="light" aria-pressed="false">LIGHT</button>
      <button class="theme-key" type="button" data-theme-choice="dark" aria-pressed="true">DARK</button>
    </div>
    <main class="photo-shell">
      <div class="masonry">
        <div class="photo-card">
          <img src="images/photo1.jpg" alt="" />
          <div class="photo-info">
            <p>2026.06.26 18:30</p>
            <p>Sony Xperia 1 III</p>
            <p>上海</p>
          </div>
        </div>
        <div class="photo-card">
          <img src="images/photo2.jpg" alt="" />
          <div class="photo-info">
            <p>2026.06.20 14:12</p>
            <p>Canon EOS R6</p>
            <p>杭州</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
